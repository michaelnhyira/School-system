<!DOCTYPE html>
<html>
<head>
    <title>SMS Test</title>
</head>
<body>
    <h1>SMS Test</h1>
    <button onclick="testSMS()">Test SMS</button>
    <div id="result"></div>

    <script>
        async function testSMS() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing SMS...';
            
            try {
                const response = await fetch('https://us-central1-school-management-e6e17.cloudfunctions.net/sendSMS', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        to: '233547441320',
                        message: 'Test message from Firebase Cloud Function',
                        from: 'JOHNWILLIAMS'
                    })
                });
                
                const data = await response.json();
                resultDiv.innerHTML = `
                    <h3>Response:</h3>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                resultDiv.innerHTML = `<h3>Error:</h3><pre>${error.message}</pre>`;
            }
        }
    </script>
</body>
</html>
